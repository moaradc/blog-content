<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>好友链接</title>
</head>
<body>
  <h1>好友链接</h1>
  <ul id="friend-list"></ul>

  <script>
    const api = 'https://raw.githubusercontent.com/moaradc/moara-friends/refs/heads/main/friends.json';

    async function loadUrls() {
      const list = document.getElementById('friend-list');
      try {
        const res = await fetch(api);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        list.innerHTML = '';
        data.forEach(item => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = item.url;
          a.textContent = item.url;
          a.target = '_blank';
          a.rel = 'noopener';
          li.appendChild(a);
          list.appendChild(li);
        });
      } catch (err) {
        list.innerHTML = '<li>加载失败：' + err.message + '</li>';
      }
    }

    loadUrls();
  </script>
</body>
</html>
