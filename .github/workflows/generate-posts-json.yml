name: Generate posts.json

# push 到 cms 时自动跑：clean-frontmatter → generate-posts → generate-sitemap → generate-article-html
# 产物 commit 回 cms。release.yml 负责把 docs/ 打包成 dist/ 推到 main。

on:
  push:
    branches: [cms]
    paths:
      - "docs/posts/**"
      - "generate-posts.js"
      - "generate-sitemap.js"
      - "generate-article-html.js"
      - "template/article.html"
      - "clean-frontmatter.js"
      - "site.js"
      - ".github/workflows/generate-posts-json.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: generate-posts-json
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cms
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect changed post files
        id: changed
        env:
          BEFORE: ${{ github.event.before || 'HEAD~1' }}
        run: |
          # 3-way fallback: BEFORE..HEAD → HEAD~1..HEAD → 全量
          mapfile -t FILES < <(git diff --name-only "$BEFORE"..HEAD -- 'docs/posts/*.md' 2>/dev/null || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            mapfile -t FILES < <(git diff --name-only HEAD~1..HEAD -- 'docs/posts/*.md' 2>/dev/null || true)
          fi
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "incremental=false" >> "$GITHUB_OUTPUT"
          else
            EXISTING=()
            for f in "${FILES[@]}"; do
              if [ -f "$f" ]; then
                EXISTING+=("$f")
              fi
            done
            if [ ${#EXISTING[@]} -eq 0 ]; then
              echo "incremental=true" >> "$GITHUB_OUTPUT"
              echo "files=" >> "$GITHUB_OUTPUT"
              echo "all_files=${FILES[*]}" >> "$GITHUB_OUTPUT"
            else
              echo "📝 增量更新 ${#EXISTING[@]} 个文件"
              echo "incremental=true" >> "$GITHUB_OUTPUT"
              echo "files=${EXISTING[*]}" >> "$GITHUB_OUTPUT"
              echo "all_files=${FILES[*]}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Clean frontmatter
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BLOG_URL: ${{ vars.BLOG_URL }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          INCREMENTAL: ${{ steps.changed.outputs.incremental }}
        run: |
          if [ "$INCREMENTAL" = "true" ] && [ -n "$CHANGED_FILES" ]; then
            # shellcheck disable=SC2086
            node clean-frontmatter.js $CHANGED_FILES
          elif [ "$INCREMENTAL" = "true" ]; then
            echo "ℹ️  跳过 clean-frontmatter"
          else
            node clean-frontmatter.js
          fi

      - name: Generate posts.json
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BLOG_URL: ${{ vars.BLOG_URL }}
        run: node generate-posts.js

      - name: Generate sitemap.xml
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BLOG_URL: ${{ vars.BLOG_URL }}
        run: node generate-sitemap.js

      - name: Generate article SEO HTML
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BLOG_URL: ${{ vars.BLOG_URL }}
          CHANGED_FILES: ${{ steps.changed.outputs.all_files }}
          INCREMENTAL: ${{ steps.changed.outputs.incremental }}
        run: |
          if [ "$INCREMENTAL" = "true" ] && [ -n "$CHANGED_FILES" ]; then
            # shellcheck disable=SC2086
            node generate-article-html.js $CHANGED_FILES
          elif [ "$INCREMENTAL" = "true" ]; then
            echo "ℹ️  跳过 generate-article-html"
          else
            node generate-article-html.js
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "moaradc"
          git config user.email "143486936+moaradc@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️  无变化，跳过提交"
          else
            git commit -m "chore: auto-clean frontmatter + generate posts.json + sitemap + article HTML [skip ci]"
            git push
          fi
