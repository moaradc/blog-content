name: Generate Sitemap

# 独立工作流：扫描 posts/*.md，生成 sitemap.xml
#
# 触发条件：push 到 main 时（posts/ 目录或脚本有改动）
# 也支持手动触发（workflow_dispatch）
#
# 与 generate-posts-json.yml 解耦：
#   - generate-posts-json.yml 负责清 frontmatter + 生成 posts.json
#   - generate-sitemap.yml   负责生成 sitemap.xml
#   - 两者独立运行，互不阻塞，职责清晰
#
# 生成的文件：
#   - docs/sitemap.xml          （主 sitemap，单文件 urlset 或 sitemapindex）
#   - docs/sitemap-{n}.xml      （分片文件，仅文章数 > 10000 时生成）
#   - docs/xsl/sitemap.xsl      （样式表，已在仓库内，不重新生成）

on:
  push:
    branches: [main]
    paths:
      - "docs/posts/**"
      - "generate-sitemap.js"
      - "docs/xsl/sitemap.xsl"
      - ".github/workflows/generate-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap.xml
        run: node generate-sitemap.js

      - name: Commit and push if changed
        run: |
          git config user.name "moaradc"
          git config user.email "143486936+moaradc@users.noreply.github.com"
          git add docs/sitemap.xml docs/sitemap-*.xml 2>/dev/null || git add docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "ℹ️  sitemap.xml 无变化，跳过提交"
          else
            git commit -m "chore: regenerate sitemap.xml [skip ci]"
            git push
            echo "✅ sitemap.xml 已提交"
          fi
