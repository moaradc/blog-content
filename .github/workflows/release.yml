name: Release

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout cms
        uses: actions/checkout@v4
        with:
          ref: cms
          fetch-depth: 1

      - name: 校验 docs/ 产物完整
        run: |
          test -f docs/index.html || { echo "❌ docs/index.html 缺失"; exit 1; }
          test -f docs/posts.json || { echo "❌ docs/posts.json 缺失"; exit 1; }
          test -f docs/sitemap.xml || { echo "❌ docs/sitemap.xml 缺失"; exit 1; }

      - name: 推送产物到 main（孤儿分支强推）
        env:
          TOKEN: ${{ github.token }}
        run: |
          WORKDIR="$(mktemp -d)"
          cp -r docs "$WORKDIR/dist"
          cp wrangler.jsonc "$WORKDIR/"

          cd "$WORKDIR"
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q \
            -m "build: ${GITHUB_SHA:0:7} 的构建产物" \
            -m "源码提交: ${GITHUB_SHA}" \
            -m "workflow: ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main
          rm -rf "$WORKDIR"
